# Place at /etc/nginx/sites-available/sentiment-bot
# Then: sudo ln -s /etc/nginx/sites-available/sentiment-bot /etc/nginx/sites-enabled/
#       sudo nginx -t && sudo systemctl restart nginx
# Add HTTPS afterward with: sudo certbot --nginx -d yourdomain.com

server {
    listen 80;
    server_name your_ec2_public_ip_or_domain;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
